<!DOCTYPE html><html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#f4e7d0">
<title>WINZ Security — Login</title><style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    background: #f4e7d0;
    color: #111;
    font-family: Arial, Helvetica, sans-serif;
}

.login-wrapper {
    width: 100%;
    max-width: 430px;
}

.brand {
    margin-bottom: 18px;
    text-align: center;
}

.brand h1 {
    font-size: clamp(34px, 10vw, 54px);
    font-weight: 1000;
    letter-spacing: -3px;
    text-transform: uppercase;
}

.brand p {
    margin-top: 5px;
    font-size: 13px;
    font-weight: 800;
    text-transform: uppercase;
}

.login-card {
    background: #fff;
    border: 4px solid #111;
    box-shadow: 10px 10px 0 #111;
    padding: 28px;
}

.card-title {
    display: inline-block;
    background: #ff3b30;
    color: #fff;
    border: 3px solid #111;
    box-shadow: 5px 5px 0 #111;
    padding: 8px 12px;
    font-weight: 1000;
    margin-bottom: 28px;
    transform: rotate(-2deg);
}

.field {
    margin-bottom: 20px;
}

label {
    display: block;
    margin-bottom: 8px;
    font-size: 14px;
    font-weight: 1000;
    text-transform: uppercase;
}

input {
    width: 100%;
    height: 52px;
    border: 3px solid #111;
    outline: none;
    background: #fffdf7;
    padding: 0 14px;
    font-size: 16px;
    font-weight: 700;
    box-shadow: 5px 5px 0 #111;
}

input:focus {
    background: #fff5a8;
    transform: translate(2px, 2px);
    box-shadow: 3px 3px 0 #111;
}

.login-button {
    width: 100%;
    height: 56px;
    border: 3px solid #111;
    background: #ffd400;
    color: #111;
    font-size: 17px;
    font-weight: 1000;
    text-transform: uppercase;
    cursor: pointer;
    box-shadow: 6px 6px 0 #111;
    transition: 0.12s ease;
}

.login-button:hover {
    background: #00e5ff;
}

.login-button:active {
    transform: translate(5px, 5px);
    box-shadow: 1px 1px 0 #111;
}

.message {
    display: none;
    margin-top: 20px;
    padding: 12px;
    border: 3px solid #111;
    background: #ff3b30;
    color: #fff;
    font-size: 13px;
    font-weight: 900;
}

.footer {
    margin-top: 24px;
    text-align: center;
    font-size: 11px;
    font-weight: 900;
    text-transform: uppercase;
}

.badge {
    display: inline-block;
    margin-top: 8px;
    padding: 5px 8px;
    border: 2px solid #111;
    background: #00e5ff;
}
</style></head><body><div class="login-wrapper"><div class="brand">
    <h1>WINZ</h1>
    <p>Security Control Panel</p>
</div>

<div class="login-card">

    <div class="card-title">
        ACCESS REQUIRED
    </div>

    <form id="loginForm">

        <div class="field">
            <label for="username">Username</label>
            <input
                type="text"
                id="username"
                autocomplete="username"
                placeholder="Enter username"
                required
            >
        </div>

        <div class="field">
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                autocomplete="current-password"
                placeholder="Enter password"
                required
            >
        </div>

        <button type="submit" class="login-button">
            LOGIN →
        </button>

        <div id="message" class="message"></div>

    </form>
</div>

<div class="footer">
    Protected Access
    <div class="badge">WINZ SECURITY</div>
</div>

</div><script>
const loginForm = document.getElementById("loginForm");
const message = document.getElementById("message");

loginForm.addEventListener("submit", function(event) {
    event.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value;

    /*
      DEMO FRONTEND SAJA.

      Jangan gunakan ini sebagai sistem keamanan
      ketika website sudah online.

      Nanti bagian ini kita ganti dengan request
      ke backend:
      
      POST /api/login

      sehingga password tidak disimpan di HTML.
    */

    if (username === "WINZ" && password === "WINZ6666") {
        message.style.display = "block";
        message.style.background = "#00a86b";
        message.textContent = "LOGIN BERHASIL — DEMO MODE";

        setTimeout(() => {
            window.location.href = "dashboard.html";
        }, 700);

    } else {
        message.style.display = "block";
        message.style.background = "#ff3b30";
        message.textContent = "USERNAME ATAU PASSWORD SALAH.";
    }
});
</script></body>
</html>
